<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタルカードゲーム Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <!-- CPU側 -->
    <div class="leader cpu-leader">
      <div>CPU HP: <span id="cpu-hp">25</span></div>
      <div>マナ: <span id="cpu-mana">0/0</span> ／ エナジー: <span id="cpu-energy">0</span></div>
      <button onclick="attackLeader()">リーダーを攻撃</button>
    </div>

    <div class="field-row">
      <div class="field-label">後列</div>
      <div id="cpu-slot-3" class="slot"></div>
      <div id="cpu-slot-4" class="slot"></div>
      <div id="cpu-slot-5" class="slot"></div>
    </div>
    <div class="field-row">
      <div class="field-label">前列</div>
      <div id="cpu-slot-0" class="slot"></div>
      <div id="cpu-slot-1" class="slot"></div>
      <div id="cpu-slot-2" class="slot"></div>
    </div>

    <hr>

    <!-- プレイヤー側 -->
    <div class="field-row">
      <div class="field-label">前列</div>
      <div id="player-slot-0" class="slot"></div>
      <div id="player-slot-1" class="slot"></div>
      <div id="player-slot-2" class="slot"></div>
    </div>
    <div class="field-row">
      <div class="field-label">後列</div>
      <div id="player-slot-3" class="slot"></div>
      <div id="player-slot-4" class="slot"></div>
      <div id="player-slot-5" class="slot"></div>
    </div>

    <div class="leader player-leader">
      <div>あなた HP: <span id="player-hp">25</span></div>
      <div>マナ: <span id="player-mana">0/0</span> ／ エナジー: <span id="player-energy">0</span></div>
    </div>

    <div id="turn-info">準備中...</div>

    <div class="controls">
      <button id="btn-end-turn" onclick="endTurn()">ターン終了</button>
      <button id="btn-energy" onclick="chargeEnergy()">エナジー溜める (1マナ)</button>
      <button id="btn-energy-ability" onclick="useEnergyAbility()">エナジー能力発動</button>
    </div>

    <div id="player-hand" class="hand"></div>

    <div id="log" class="log"></div>
  </div>

  <script src="data/cards.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
